        class CurriculumApp {
            constructor() {
                this.courses = [];
                this.currentCourseId = null;
                this.currentView = 'home';
                this.pendingDeleteId = null;
                this.init();
            }

            init() {
                this.loadCourses();
                if (this.courses.length === 0) {
                    this.createDemoCourse();
                } else {
                    this.currentCourseId = this.courses[0].id;
                }
                this.renderView('home');
            }

            loadCourses() {
                try {
                    const data = localStorage.getItem('wenchang_curriculum_courses');
                    const parsed = data ? JSON.parse(data) : [];
                    if (Array.isArray(parsed)) {
                        this.courses = parsed.filter(item => item && typeof item === 'object' && item.id && typeof item.id === 'string');
                    } else {
                        this.courses = [];
                    }
                } catch (e) {
                    console.error('Failed to load courses from localStorage', e);
                    this.courses = [];
                }
            }

            saveCourses() {
                try {
                    localStorage.setItem('wenchang_curriculum_courses', JSON.stringify(this.courses));
                } catch (e) {
                    console.error('Failed to save to localStorage', e);
                    this.showStorageWarningModal();
                }
            }

            showStorageWarningModal() {
                const modal = document.getElementById('storage-warning-modal');
                if (modal) modal.classList.remove('hidden');
            }

            closeStorageWarningModal() {
                const modal = document.getElementById('storage-warning-modal');
                if (modal) modal.classList.add('hidden');
            }

            escapeHtml(str) {
                if (typeof str !== 'string') return '';
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            triggerPrint() {
                if (this.currentView !== 'overview') {
                    this.navTo('overview');
                    setTimeout(() => {
                        window.print();
                    }, 300);
                } else {
                    window.print();
                }
            }

            getCurrentCourse() {
                return this.courses.find(c => c.id === this.currentCourseId) || this.courses[0];
            }

            updateCourseField(field, value) {
                const c = this.getCurrentCourse();
                if (!c) return;
                c[field] = value;
                c.updatedAt = new Date().toISOString().split('T')[0];
                this.saveCourses();
                this.showToast('已自動儲存');
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-msg');
                if (toast && toastMsg) {
                    toastMsg.innerText = msg;
                    toast.classList.remove('opacity-0', 'pointer-events-none');
                    toast.classList.add('opacity-100');
                    setTimeout(() => {
                        toast.classList.remove('opacity-100');
                        toast.classList.add('opacity-0', 'pointer-events-none');
                    }, 2000);
                }
            }

            navTo(view) {
                this.currentView = view;
                this.renderView(view);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            goToStep(stepNum) {
                const c = this.getCurrentCourse();
                if (c) {
                    c.currentStep = stepNum;
                    c.progress = Math.min(100, Math.round((stepNum / 6) * 100));
                    this.saveCourses();
                }
                this.navTo(`step${stepNum}`);
            }

            renderView(view) {
                const main = document.getElementById('main-content');
                const stepBar = document.getElementById('step-nav-bar');
                if (!main) return;

                if (stepBar) {
                    if (view.startsWith('step') || view === 'overview') {
                        stepBar.classList.remove('hidden');
                        
                        // Highlight active step button
                        for (let i = 1; i <= 6; i++) {
                            const btn = document.getElementById(`step-btn-${i}`);
                            if (btn) {
                                if (view === `step${i}`) {
                                    btn.className = "px-3 py-1.5 rounded-lg font-bold bg-brand-600 text-white shadow-sm transition";
                                } else {
                                    btn.className = "px-3 py-1.5 rounded-lg transition font-medium text-slate-300 hover:bg-slate-700";
                                }
                            }
                        }
                        const overviewBtn = document.getElementById('step-btn-overview');
                        if (overviewBtn) {
                            if (view === 'overview') {
                                overviewBtn.className = "px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold shadow-sm transition";
                            } else {
                                overviewBtn.className = "px-3 py-1.5 rounded-lg bg-brand-600 text-white font-bold hover:bg-brand-500 transition";
                            }
                        }
                    } else {
                        stepBar.classList.add('hidden');
                    }
                }

                switch (view) {
                    case 'home': main.innerHTML = this.templateHome(); break;
                    case 'step1': main.innerHTML = this.templateStep1(); break;
                    case 'step2': main.innerHTML = this.templateStep2(); break;
                    case 'step3': main.innerHTML = this.templateStep3(); break;
                    case 'step4': main.innerHTML = this.templateStep4(); break;
                    case 'step5': main.innerHTML = this.templateStep5(); break;

                    c.selectedConcepts.splice(idx, 1);
                } else {
                    c.selectedConcepts.push(conceptId);
                }
                this.saveCourses();
                this.renderView('step2');

                const container = document.getElementById('bigidea-suggestions-container');
                if (!container) return;

                    c.selectedConcepts.map(id => {
                        const item = CORE_CONCEPTS.find(x => x.id === id);
                        return item ? item.zh : id;
                    }).join('與') : '個人選擇';

                this.lastBigIdeaSuggestions = [
                    `人們在「${c.topic || '此主題'}」中的抉擇，會透過「${conceptsText}」深刻影響我們的生活與未來環境。`,
                    `當我們理解「${c.topic || '這項議題'}」背後的「${conceptsText}」，就能在日常生活中做出負責任的行動。`,
                    `理解「${conceptsText}」能幫助我們從不同角度審視「${c.topic || '這項問題'}」，並找到永續的解決之道。`
                ];

                container.innerHTML = `

                    <div class="space-y-2">

                                <span class="font-bold text-amber-400">${idx+1}.</span>
                                <span class="flex-1">${this.escapeHtml(s)}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.classList.remove('hidden');
            }

            applyBigIdeaSuggestionByIndex(index) {
                if (!this.lastBigIdeaSuggestions || !this.lastBigIdeaSuggestions[index]) return;

                const input = document.getElementById('input-bigidea');
                if (input) input.value = text;
                this.showToast('已代入 Big Idea 建議');

                this.saveCourses();
                this.closeConfirmModal();
                this.renderView('courses');

                const total = this.courses.length;
                
                const directions = [

                const dirStats = directions.map(d => {
                    const strong = this.courses.filter(c => c.studentDevelopment?.[d.key]?.level === '很有關').length;

                    return { ...d, strong, partial, total: strong + partial };

                    const partial = this.courses.filter(c => c.curriculumVision?.[v.key]?.level === '有一點關係').length;
                    return { ...v, strong, partial, total: strong + partial };
                });

                const allEvidences = [];
                this.courses.forEach(c => {
                    directions.forEach(d => {

                    visions.forEach(v => {
                        const ev = c.curriculumVision?.[v.key]?.evidence;
                        if (ev) allEvidences.push({ courseTitle: c.title || '未命名課程', topic: v.name, text: ev });
                    });
                    if (c.otherTraits) {
                        allEvidences.push({ courseTitle: c.title || '未命名課程', topic: '其他特質', text: c.otherTraits });

                            <div class="font-bold text-sm">💡 共同特質地圖說明</div>
                            <p class="leading-relaxed">
                                目前共有 <strong>${total}</strong> 份課程設計記錄。數字多不代表比較好，數字少也不代表沒有培養。地圖幫助我們發現已經形成的共識，以及未來值得攜手深化探究的方向。
                            </p>
                        </div>

                        <!-- 5 Student Directions Summary -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">九、文昌學生發展的五個方向統計</h3>
                            <div class="space-y-3">
                                ${dirStats.map(d => `
                                    <div class="space-y-1 text-xs">
                                        <div class="flex items-center justify-between font-bold text-slate-800">
                                            <span>${d.name}</span>
                                            <span class="text-brand-600">${d.total} 份課程相關 (${d.strong} 很有關 / ${d.partial} 有一點關係)</span>
                                        </div>
                                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                                            <div class="bg-brand-600 h-full" style="width: ${total > 0 ? (d.strong / total) * 100 : 0}%"></div>
                                            <div class="bg-brand-300 h-full" style="width: ${total > 0 ? (d.partial / total) * 100 : 0}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 3 Visions Summary -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">十、課程願景檢視 (品德、品質、品味)</h3>
                            <div class="space-y-3">
                                ${visionStats.map(v => `
                                    <div class="space-y-1 text-xs">
                                        <div class="flex items-center justify-between font-bold text-slate-800">
                                            <span>${v.name}</span>
                                            <span class="text-sage-700 font-bold">${v.total} 份課程相關 (${v.strong} 很有關 / ${v.partial} 有一點關係)</span>
                                        </div>
                                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                                            <div class="bg-sage-700 h-full" style="width: ${total > 0 ? (v.strong / total) * 100 : 0}%"></div>
                                            <div class="bg-sage-300 h-full" style="width: ${total > 0 ? (v.partial / total) * 100 : 0}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Evidence Collection -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="text-base font-bold text-slate-900 border-b border-slate-100 pb-2">📌 全校課程觀察到的具體證據記錄 (${allEvidences.length})</h3>
                            ${allEvidences.length === 0 ? `
                                <p class="text-xs text-slate-400">目前尚無教師留下具體觀察證據。</p>
                            ` : `
                                <div class="space-y-2 max-h-80 overflow-y-auto pr-2">
                                    ${allEvidences.map(ev => `
                                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-1">
                                            <div class="flex items-center justify-between text-slate-500 text-[11px]">
                                                <span class="font-bold text-brand-800">${this.escapeHtml(ev.courseTitle)}</span>
                                                <span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-medium">${this.escapeHtml(ev.topic)}</span>
                                            </div>
                                            <p class="text-slate-800 leading-relaxed">「${this.escapeHtml(ev.text)}」</p>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }

            templateGlobalCards() {
                return `
                    <div class="max-w-6xl mx-auto space-y-8 page-transition">
                        <div class="space-y-2 border-b border-slate-200 pb-4">
                            <h2 class="text-2xl font-bold text-slate-900">🃏 全球思考卡庫 (Global Thinking Cards)</h2>
                            <p class="text-xs text-slate-500">不是標準答案，而是幫助我們備課時多想一步的支架工具。</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${CORE_CONCEPTS.map(c => `
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 flex flex-col justify-between">
                                    <div class="space-y-2">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded">${c.id}</span>
                                            <span class="text-xs font-bold text-slate-900">${c.zh}</span>
                                        </div>
                                        <p class="text-xs text-slate-600 leading-relaxed font-semibold">「${c.childDesc}」</p>
                                        <p class="text-[11px] text-slate-500">${c.desc}</p>
                                    </div>
                                    <button onclick="app.showConceptDetailModal('${c.id}')" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold transition mt-2">
                                        🔍 查看完整的 15 個提問範例
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            templateAbout() {
                return `
                    <div class="max-w-4xl mx-auto space-y-8 page-transition">
                        <div class="space-y-2 border-b border-slate-200 pb-4">
                            <h2 class="text-2xl font-bold text-slate-900">❓ 這個工具怎麼使用？</h2>
                            <p class="text-xs text-slate-500">關於設計理念、存檔與常見疑問</p>
                        </div>

                        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6 text-xs leading-relaxed text-slate-700">
                            <h3 class="text-sm font-bold text-slate-900">💡 備課原則與存檔安全說明</h3>
                            <ul class="list-disc list-inside space-y-2">
                                <li><strong>不求一次完成：</strong> 課程會自動存檔於本機瀏覽器，可隨時修改。</li>
                                <li><strong>備份下載原則：</strong> 若清除瀏覽器快取、使用無痕模式或更換電腦，瀏覽器內的暫存資料可能清除。建議完成思考後，點選「下載 Word (.docx)」將完整的課程備份儲存至您的電腦。</li>
                                <li><strong>不求每一格都填：</strong> 不是每個單元都必須有大型專案或跨領域。</li>
                                <li><strong>先想「為什麼」，再想「怎麼做」：</strong> 活動很多，但真正重要的是這個活動為什麼值得學生經歷。</li>
                            </ul>

                            <div class="pt-4 border-t border-slate-200 space-y-2">
                                <h3 class="text-sm font-bold text-slate-900">🌏 關於設計者與理念來源</h3>
                                <p>本工具由臺北市文昌國民小學 鍾靜宜老師設計。</p>
                                <p>參考概念本位、探究導向與以理解為核心的國際課程設計理念，並依文昌國小課程發展需求進行轉化與調整。</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            showConceptDetailModal(conceptId) {
                const c = CORE_CONCEPTS.find(x => x.id === conceptId);
                if (!c) return;

                const modal = document.getElementById('concept-modal');
                const content = document.getElementById('concept-modal-content');
                if (!modal || !content) return;

                content.innerHTML = `
                    <div class="space-y-1 pr-6">
                        <div class="text-xs font-bold text-brand-600 uppercase tracking-wider">核心概念卡片詳情</div>
                        <h3 class="text-2xl font-extrabold text-slate-900">${this.escapeHtml(c.name)}</h3>
                    </div>
                    
                    <div class="space-y-4 text-xs">
                        <div class="bg-brand-50 p-4 rounded-xl border border-brand-100 text-brand-900 space-y-1">
                            <strong class="text-xs font-bold uppercase text-brand-800">👧🏻 國小學生好懂的童言童語說明：</strong>
                            <p class="text-xs font-semibold leading-relaxed">「${this.escapeHtml(c.childDesc || c.desc)}」</p>
                        </div>

                        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-1">
                            <strong class="text-slate-800">💡 概念核心說明：</strong>
                            <p class="text-slate-600 leading-relaxed">${this.escapeHtml(c.desc)}</p>
                        </div>

                        <div class="space-y-3 pt-2 border-t border-slate-200">
                            <h4 class="font-bold text-slate-900 text-xs">❓ 探究提問設計引導 (事實性、概念性、辯論性各 5 個範例)：</h4>

                            <div class="bg-blue-50/70 p-3.5 rounded-xl border border-blue-100 space-y-2">
                                <div class="font-bold text-blue-900 text-xs">📌 事實性提問 (Factual Questions x5)</div>
                                <ol class="list-decimal list-inside text-xs text-blue-950 space-y-1">
                                    ${c.questions.factual.map(q => `<li>${this.escapeHtml(q)}</li>`).join('')}
                                </ol>
                            </div>

                            <div class="bg-emerald-50/70 p-3.5 rounded-xl border border-emerald-100 space-y-2">
                                <div class="font-bold text-emerald-900 text-xs">💡 概念性提問 (Conceptual Questions x5)</div>
                                <ol class="list-decimal list-inside text-xs text-emerald-950 space-y-1">
                                    ${c.questions.conceptual.map(q => `<li>${this.escapeHtml(q)}</li>`).join('')}
                                </ol>
                            </div>

                            <div class="bg-purple-50/70 p-3.5 rounded-xl border border-purple-100 space-y-2">
                                <div class="font-bold text-purple-900 text-xs">⚖️ 辯論性提問 (Debatable Questions x5)</div>
                                <ol class="list-decimal list-inside text-xs text-purple-950 space-y-1">
                                    ${c.questions.debatable.map(q => `<li>${this.escapeHtml(q)}</li>`).join('')}
                                </ol>
                            </div>
                        </div>
                    </div>

                    <div class="pt-3">
                        <button onclick="app.closeConceptDetailModal()" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition">
                            關閉視窗
                        </button>
                    </div>
                `;

                modal.classList.remove('hidden');
            }

            closeConceptDetailModal() {
                const modal = document.getElementById('concept-modal');
                if (modal) modal.classList.add('hidden');
            }
        }

        let app;
        window.onload = function() {
            app = new CurriculumApp();
        };
    </script>
</body>
</html>
